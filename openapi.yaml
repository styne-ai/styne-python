          - control
          default: view
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
    LiveViewLink:
      type: object
      properties:
        id:
          type: string
        object:
          const: live_view_link
        url:
          type: string
          description: Opens the live view without a Styne login; the signature in the URL is the whole authorisation.
        mode:
          type: string
          enum:
          - view
          - control
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - url
      - mode
      - expires_at
    Region:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        available:
          type: boolean
        products:
          type: array
          items:
            type: string
    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price_usd_month:
          type: number
        credit_grant_usd:
          type: number
        limits:
          type: object
          properties:
            rate_limit_rpm:
              type: integer
            concurrency:
              type: integer
            log_retention_days:
              type: integer
        support_level:
          type: string
        perks:
          type: array
          items:
            type: string
    Budget:
      type: object
      description: A spending limit for a day or a month. Only account budgets are enforced; for one API key use the key's monthly spend cap.
      properties:
        object:
          type: string
          enum:
          - run_budget
        id:
          type: string
        scope:
          type: string
          enum:
          - account
        period:
          type: string
          enum:
          - day
          - month
        limit_micro:
          type: integer
          description: The limit in millionths of a dollar.
        threshold_pct:
          type: integer
          description: The share of the limit at which the owners are first told.
        action:
          type: string
          enum:
          - notify
          - pause
          description: pause refuses new creates while the account is over the limit.
        spent_micro:
          type: integer
        state:
          type: string
          enum:
          - within
          - alert
          - over
        holding_creates:
          type: boolean
        period_start:
          type: string
          format: date-time
        resets_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    Name:
      type: object
      properties:
        name:
          type: string
        vm_id:
          type: string
    Key:
      type: object
      properties:
        object:
          type: string
          enum:
          - key
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        last4:
          type: string
        preset:
          type: string
          enum:
          - full
          - vms
          - browsers
          - ci
          description: What the key may do. A key made without one runs workloads and reads its limits and events; account settings and keys need full.
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
          - frozen
        secret:
          type: string
          description: Returned once at creation only.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    CreateKey:
      type: object
      properties:
        name:
          type: string
        preset:
          type: string
          enum:
          - full
          - vms
          - browsers
          - ci
      required:
      - name
    UpdateKey:
      type: object
      properties:
        name:
          type: string
        preset:
          type: string
          enum:
          - full
          - vms
          - browsers
          - ci
    KeyScopes:
      type: object
      description: Send a preset, or scopes that are exactly the scopes of one preset.
      properties:
        preset:
          type: string
          enum:
          - full
          - vms
          - browsers
          - ci
        scopes:
          type: array
          items:
            type: string
    Webhook:
      type: object
      properties:
        object:
          type: string
          enum:
          - webhook
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        description:
          type: string
        status:
          type: string
          enum:
          - enabled
          - disabled
        disabled_reason:
          type: string
        secret:
          type: string
          description: Signing secret, returned at creation and rotation only. Standard Webhooks headers.
        created_at:
          type: string
          format: date-time
    CreateWebhook:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
            - '*'
            - vm.created
            - vm.paused
            - vm.resumed
            - vm.killed
            - vm.timeout
            - vm.error
          description: Empty or ["*"] sends every event.
        description:
          type: string
      required:
      - url
    TicketReq:
      type: object
      properties:
        resource:
          type: string
          description: The id of the VM.
        kind:
          type: string
          enum:
          - pty
          - live_view
      required:
      - resource
      - kind
    BudgetInput:
      type: object
      required:
      - limit_micro
      properties:
        scope:
          type: string
          enum:
          - account
          default: account
        period:
          type: string
          enum:
          - day
          - month
          default: month
        limit_micro:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
          - notify
          - pause
          default: notify
        threshold_pct:
          type: integer
          minimum: 1
          maximum: 99
    Invoice:
      type: object
      properties:
        object:
          type: string
          enum:
          - invoice
        id:
          type: string
        number:
          type: string
        status:
          type: string
        subtotal_cents:
          type: integer
        tax_cents:
          type: integer
        total_cents:
          type: integer
        amount_paid_cents:
          type: integer
        hosted_invoice_url:
          type: string
        pdf_url:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
        paid_at:
          type: string
          format: date-time
    KeyScopeSet:
      type: object
      properties:
        object:
          type: string
          enum:
          - key_scopes
        key_id:
          type: string
        preset:
          type: string
          enum:
          - full
          - vms
          - browsers
          - ci
        scopes:
          type: array
          items:
            type: string
    UpdateWebhook:
      type: object
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
            - '*'
            - vm.created
            - vm.paused
            - vm.resumed
            - vm.killed
            - vm.timeout
            - vm.error
        description:
          type: string
        status:
          type: string
          enum:
          - enabled
          - disabled
    Ticket:
      type: object
      properties:
        object:
          type: string
          enum:
          - ticket
        ticket:
          type: string
          description: Single use, valid for a minute.
        kind:
          type: string
          enum:
          - pty
          - live_view
        resource:
          type: string
        expires_at:
          type: string
          format: date-time
        ws_url:
          type: string
  headers:
    RateLimit-Limit:
      description: Requests allowed in the tightest window
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until reset
      schema:
        type: integer
    X-Request-Id:
      description: Request id, equals error.request_id
      schema:
        type: string
  responses:
    Error:
      description: Error envelope (see schema Error); 429 and 503 add Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
