openapi: 3.1.0
info:
  title: Styne API
  version: 1.0.0
  summary: StyneVM and StyneBrowser
  description: 'All routes are served on https://api.styne.ai/v1. Operations marked x-status: planned are not served yet.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://api.styne.ai/v1
security:
- bearer: []
tags:
- name: Account
- name: Agents
- name: Browsers
- name: CI
- name: Checkpoints
- name: Commands
- name: Files
- name: Keys
- name: Ports
- name: Regions
- name: SSH
- name: Snapshots
- name: State
- name: Templates
- name: VMs
- name: Webhooks
paths:
  /vms:
    post:
      tags:
      - VMs
      operationId: createVm
      summary: Create a VM from a template, snapshot or size
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVm'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - VMs
      operationId: listVms
      summary: 'List VMs (filters: state, region, metadata)'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vm'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}:
    get:
      tags:
      - VMs
      operationId: getVm
      summary: Read one VM
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - VMs
      operationId: updateVm
      summary: Change timeout_seconds, metadata, auto_pause
      parameters:
      - $ref: '#/components/parameters/vm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - VMs
      operationId: killVm
      summary: Kill a VM
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/connect:
    post:
      tags:
      - VMs
      operationId: connectVm
      summary: Return the VM and resume it if paused
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/extend:
    post:
      tags:
      - VMs
      operationId: extendVm
      summary: Extend the lifetime of a running VM
      parameters:
      - $ref: '#/components/parameters/vm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Extend'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/pause:
    post:
      tags:
      - VMs
      operationId: pauseVm
      summary: Pause at a tier (hot, standby, archived)
      parameters:
      - $ref: '#/components/parameters/vm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pause'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/resume:
    post:
      tags:
      - VMs
      operationId: resumeVm
      summary: Resume a paused VM
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/fork:
    post:
      tags:
      - VMs
      operationId: forkVm
      summary: Fork a VM into count new VMs
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fork'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmList'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/network:
    put:
      tags:
      - VMs
      operationId: setVmNetwork
      summary: Set the egress policy
      parameters:
      - $ref: '#/components/parameters/vm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Network'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vm'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/metrics:
    get:
      tags:
      - VMs
      operationId: getVmMetrics
      summary: CPU, memory, disk and network over a window
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/logs:
    get:
      tags:
      - VMs
      operationId: getVmLogs
      summary: Command output log of the VM
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/top:
    get:
      tags:
      - VMs
      operationId: getVmTop
      summary: Processes running now, busiest first
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/cost:
    get:
      tags:
      - VMs
      operationId: getVmCost
      summary: Cost of this VM in the calendar month (UTC)
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /names:
    get:
      tags:
      - VMs
      operationId: listNames
      summary: List the account's VM names
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Name'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/wake-triggers:
    put:
      tags:
      - VMs
      operationId: setWakeTriggers
      summary: Configure what wakes a sleeping VM
      description: Sets the events that wake a paused VM.
      x-status: planned
      parameters:
      - $ref: '#/components/parameters/vm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WakeTriggers'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeTriggers'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - VMs
      operationId: getWakeTriggers
      summary: Read wake triggers
      x-status: planned
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WakeTriggers'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/commands:
    post:
      tags:
      - Commands
      operationId: runCommand
      summary: Run a command to exit, start it detached, or stream it
      parameters:
      - $ref: '#/components/parameters/vm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCommand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
            text/event-stream:
              schema:
                type: string
                description: 'Server-sent events, each with an id: started (data {pid}), stdout and stderr (data {data}: the output bytes, base64), exit (data {exit_code, signal, timed_out}) and error (data:
                  the error object). A comment line every 15 s keeps the connection open.'
            application/x-ndjson:
              schema:
                type: string
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
      - Commands
      operationId: listCommands
      summary: Command history, newest first
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Command'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/commands/{cmd}:
    get:
      tags:
      - Commands
      operationId: getCommand
      summary: Status and exit code of a command
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/cmd'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Commands
      operationId: signalCommand
      summary: Send a signal (default TERM) to a running command
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/cmd'
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/commands/{cmd}/stream:
    get:
      tags:
      - Commands
      operationId: streamCommand
      summary: Replay and follow output (SSE, resumable with Last-Event-ID)
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/cmd'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
            text/event-stream:
              schema:
                type: string
                description: 'SSE frames: stdout, stderr, exit, error'
            application/x-ndjson:
              schema:
                type: string
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/commands/{cmd}/logs:
    get:
      tags:
      - Commands
      operationId: getCommandLogs
      summary: stdout and stderr, also after exit
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/cmd'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/commands/{cmd}/input:
    post:
      tags:
      - Commands
      operationId: sendCommandInput
      summary: Write text to a running command's stdin (data), and close it with eof; 409 when the command ended
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/cmd'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandInput'
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/pty:
    get:
      tags:
      - Commands
      operationId: openPty
      summary: Interactive terminal over WebSocket (ticket in query)
      description: Opens an interactive terminal over WebSocket.
      x-status: planned
      parameters:
      - $ref: '#/components/parameters/vm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
      x-websocket: true
  /vms/{vm}/code:
    post:
      tags:
      - Commands
      operationId: runCode
      summary: Run code in a kernel context; answers the output, results and error of the run
      parameters:
      - $ref: '#/components/parameters/vm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRun'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
  /vms/{vm}/files:
    get:
      tags:
      - Files
      operationId: readFile
      summary: 'Read a file: the bytes of the file at the path query'
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/filePath'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Files
      operationId: writeFile
      summary: 'Write a file: the request body is the file''s bytes; folders on the way are created'
      parameters:
      - $ref: '#/components/parameters/vm'
      - $ref: '#/components/parameters/filePath'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
