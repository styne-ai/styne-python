components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "sty_live_\u2026 (also e2b_\u2026 keys); X-API-Key is accepted as an alternative."
  parameters:
    filePath:
      name: path
      in: query
      required: true
      description: Absolute path in the VM; a relative path starts in the home directory.
      schema:
        type: string
    dirPath:
      name: path
      in: query
      required: false
      description: Absolute path of the directory; defaults to the home directory.
      schema:
        type: string
    linkId:
      name: link
      in: path
      required: true
      schema:
        type: string
    vm:
      name: vm
      in: path
      required: true
      schema:
        type: string
    cmd:
      name: cmd
      in: path
      required: true
      schema:
        type: string
    port:
      name: port
      in: path
      required: true
      schema:
        type: integer
    keyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
    snap:
      name: snap
      in: path
      required: true
      schema:
        type: string
    tpl:
      name: tpl
      in: path
      required: true
      schema:
        type: string
    alias:
      name: alias
      in: path
      required: true
      schema:
        type: string
    promptId:
      name: promptId
      in: path
      required: true
      schema:
        type: string
    conversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    ns:
      name: ns
      in: path
      required: true
      schema:
        type: string
    key:
      name: key
      in: path
      required: true
      schema:
        type: string
    job:
      name: job
      in: path
      required: true
      schema:
        type: string
    br:
      name: br
      in: path
      required: true
      schema:
        type: string
    budget:
      name: budget
      in: path
      required: true
      schema:
        type: string
    whk:
      name: whk
      in: path
      required: true
      schema:
        type: string
    deletion:
      name: deletion
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 255
      description: Replayed for 24 h per account and path; same key with another body = 422.
  schemas:
    Object:
      type: object
      additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            status:
              type: integer
            message:
              type: string
            origin:
              type: string
              enum:
              - client
              - customer_limit
              - infrastructure
              - guest
              - agent
              - unknown
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
            doc_url:
              type: string
          required:
          - code
          - status
          - message
          - request_id
      required:
      - error
      description: 'Codes: unauthenticated, permission_denied, plan_required, payment_required, not_found, vm_ended, conflict, failed_precondition, invalid_argument, quota_exceeded, limit_concurrent, limit_hours,
        limit_rate_minute, limit_rate_hour, limit_rate_day, limit_storage, capacity, capacity_provisioning, create_deadline, account_suspended, account_throttled, node_loss, agent_exit, command_timeout,
        sandbox_timeout, upstream_error, not_implemented. Open enum.'
    Vm:
      type: object
      properties:
        id:
          type: string
        object:
          const: vm
        state:
          type: string
          enum:
          - starting
          - running
          - paused
          - ended
        pause_tier:
          type:
          - string
          - 'null'
          enum:
          - hot
          - standby
          - archived
          - null
        region:
          type: string
        template:
          type: string
        size:
          type: string
        vcpus:
          type: integer
        memory_mib:
          type: integer
        timeout_seconds:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
        ports:
          type: array
          items:
            $ref: '#/components/schemas/Port'
      required:
      - id
      - state
      - created_at
    VmList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vm'
    CreateVm:
      type: object
      properties:
        template:
          type: string
        snapshot:
          type: string
        size:
          type: string
        vcpus:
          type: integer
        memory_mib:
          type: integer
        region:
          type: string
        timeout_seconds:
          type: integer
        auto_pause:
          type: boolean
        auto_resume:
          type: boolean
        lifecycle:
          type: object
          additionalProperties: true
        network:
